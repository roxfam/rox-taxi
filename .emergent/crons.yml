crons:
  - name: sync-google-reviews
    description: "Pulls the latest Google Business reviews via Places API every hour so the homepage rotator always has a fresh pool of 4+ star quotes."
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/sync-google-reviews"
    method: POST
    enabled: true

  - name: send-tip-bump-sms
    description: "15 minutes after a taxi/tour booking flips to completed, SMS the guest a signed link to top up the driver's tip. Runs every 5 min."
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/send-tip-bump-sms"
    method: POST
    enabled: true

  - name: send-weekly-report
    description: "Monday-morning 9am UTC recap email to the owner — last 7 days revenue, bookings, top services, and notification deliverability."
    cron: "0 9 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/send-weekly-report"
    method: POST
    enabled: true

  - name: check-delivery-alerts
    description: "Hourly deliverability watchdog — alerts the owner when SMS or email failure rate exceeds the threshold in the rolling 24h window. Alerts throttled to at most one every 6 hours."
    cron: "15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/check-delivery-alerts"
    method: POST
    enabled: true

  - name: flush-owner-sms-digest
    description: "Drains overnight quiet-hours SMS queue and sends the 5am Nassau digest to every owner phone. Fires hourly; worker gates on Nassau local time (4:30-5:30) with per-day idempotency."
    cron: "30 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/flush-owner-sms-digest"
    method: POST
    enabled: true
